name: Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.PUBLIC_POSTHOG_PROJECT_TOKEN }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}

      # Secrets are absent until they're added to the repo, and on pull requests from forks.
      - name: Deploy to production
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: |
            d1 migrations apply 40for40 --remote
            deploy

      # Preview aliases must be a lowercase DNS label short enough to sit before "-40for40".
      - name: Name the preview
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: echo "PREVIEW_ALIAS=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//' | cut -c1-40 | sed -E 's/-+$//')" >> "$GITHUB_ENV"

      - name: Upload a preview
        id: preview
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias ${{ env.PREVIEW_ALIAS }}

      - name: Comment the preview link
        if: steps.preview.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT: ${{ steps.preview.outputs.command-output }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          url=$(echo "$OUTPUT" | sed -nE 's/.*Version Preview Alias URL: (https:[^ ]+).*/\1/p' | head -1)
          [ -n "$url" ] || { echo "::warning::No preview alias URL in the wrangler output."; exit 0; }
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "Preview of ${SHA::7}: $url"

      - name: Skip deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Deploy skipped because the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets aren't set."
